<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyAgent</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Supabase JS SDK for real-time subscriptions -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- Import map for Three.js and VRM -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/",
                "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js",
                "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@3.2.0/lib/three-vrm-animation.module.js"
            }
        }
    </script>
</head>

<body>
    <div class="app-shell">

        <aside class="sidebar">

            <div class="brand">
                <h3>State</h3>
                <div id="agentState" class="state-display">
                    🟢 Idle
                </div>
            </div>

            <div class="panel avatar-panel">
                <div id="avatarContainer" class="avatar-container"></div>
            </div>

            <div class="panel conversation-panel">
                <div class="conversation-panel-header">
                    <h3>Chats</h3>
                    <button id="newChatBtn" class="new-chat-btn" title="New Chat">+</button>
                </div>
                <div id="conversationList" class="conversation-list"></div>
            </div>

            <div class="panel playback-panel" style="text-align: center; padding: 10px;">
                <button id="playbackBtn" onclick="togglePlayback()" disabled class="lang-btn" style="width: 100%;">⏸
                    Pause</button>
            </div>

            <div class="panel">
                <h3>TTS Visualizer</h3>
                <canvas id="visualizer"></canvas>
            </div>

            <div class="panel">
                <h3>Links</h3>
                <div class="meta"><a href="/" style="color:#947dff;text-decoration:none;">💬 Chat</a></div>
                <div class="meta"><a href="/uigen" style="color:#947dff;text-decoration:none;">🎨 UI Generator</a></div>
            </div>

            <div class="panel">
                <h3>System</h3>
                <div class="meta">STT <span>Whisper</span></div>
                <div class="meta">LLM <span>Llama3</span></div>
                <div class="meta">TTS <span>Cartesia TTS</span></div>
                <div class="meta">Search <span>SearXNG</span></div>
            </div>

        </aside>

        <main class="main">

            <header class="hero">
                <h2>MyAgent</h2>
                <div id="authActions" class="auth-actions">
                    <a href="signin.html" class="auth-header-btn" type="button">Sign In</a>
                    <a href="signup.html" class="auth-header-btn auth-header-btn-primary" type="button">Sign Up</a>
                </div>
                <div id="userProfile" class="user-profile header-user-profile" hidden>
                    <a href="history.html" class="history-header-btn" title="Chat History">📋</a>
                    <div class="user-details">
                        <div id="userDisplayName" class="user-name">User</div>
                        <div id="userUsername" class="user-username">@username</div>
                    </div>
                    <button id="signOutBtn" class="auth-header-btn" type="button">Sign Out</button>
                </div>
                <p>Knowledge Base • Web Search • News • Weather</p>
            </header>

            <div id="messages" class="messages">
                <div class="message ai">
                    Hello. I am your local AI assistant.
                </div>
            </div>

            <div id="typing" class="typing">
                AI is thinking...
            </div>

            <div class="language-toggle">

                <button id="englishBtn" class="lang-btn active">
                    English
                </button>

                <button id="hindiBtn" class="lang-btn">
                    हिन्दी
                </button>

            </div>

            <div id="filePreviewArea" class="file-preview-area" style="display:none;">
                <div class="file-preview-chip">
                    <span id="filePreviewName" class="file-preview-name"></span>
                    <button id="filePreviewClear" class="file-preview-clear" title="Remove file">✕</button>
                </div>
            </div>

            <div class="input-area">

                <button id="recordBtn" onclick="toggleRecording()">
                    🎤
                </button>

                <button id="attachBtn" class="attach-btn" title="Attach file or image">
                    📎
                </button>
                <input id="fileInput" type="file" accept="image/*,.pdf,.docx,.txt,.csv,.md" style="display:none" />

                <input id="messageInput" type="text" placeholder="Ask something..." />

                <button onclick="sendMessage()">
                    Send
                </button>

            </div>

        </main>

    </div>

    <!-- Supabase configuration -->
    <script>
        window.SUPABASE_CONFIG = {
            url: 'https://mnqphisyaumawekcwcgz.supabase.co',
            anonKey: 'sb_publishable_2Xgu6Laqdv7zGYyf_DiKxw_ZracWuHm',
        };
    </script>

    <script type="module" src="script.js"></script>
</body>

</html>
