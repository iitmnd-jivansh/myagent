<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAgent Live – LiveKit Voice AI</title>
    <meta name="description" content="Real-time voice AI assistant powered by LiveKit Cloud">
    <link rel="stylesheet" href="/livekit_live.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- LiveKit Client SDK (UMD build via CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
    <!-- Animated Background -->
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="noise-overlay"></div>

    <!-- Main Card -->
    <div class="glass-container" id="glassContainer">
        <div class="header">
            <h1>MyAgent Live</h1>
            <p class="subtitle">Real-time Voice AI Assistant</p>
            <span class="powered-by">
                <span class="lk-dot"></span>
                Powered by LiveKit
            </span>
        </div>

        <!-- Audio Orb Visualizer -->
        <div class="orb-container" id="orbContainer">
            <div class="orb-ring orb-ring-3"></div>
            <div class="orb-ring orb-ring-2"></div>
            <div class="orb-ring"></div>
            <div class="orb-core" id="orbCore"></div>
        </div>

        <!-- Transcript Panel -->
        <div class="transcript-panel" id="transcriptPanel">
            <div class="transcript-empty" id="transcriptEmpty">
                Conversation will appear here...
            </div>
        </div>

        <!-- Connect Button -->
        <button id="connectBtn" class="btn-connect">
            <span class="btn-text">Connect & Talk</span>
            <span class="btn-icon">🎙️</span>
        </button>

        <!-- Status -->
        <div id="statusBadge" class="status-badge disconnected">
            <span class="status-dot"></span>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <script src="/livekit_live.js"></script>
</body>
</html>
